on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-slim
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: checkout the code
        uses: actions/checkout@v6
      
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: 'install goose'
        run: 'go install github.com/pressly/goose/v3/cmd/goose@latest'

      - name: build
        run: ./scripts/buildprod.sh

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Build and submit image'
        run: 'gcloud builds submit --tag us-central1-docker.pkg.dev/notely-509917/notely-ar-repo/notely:latest .'

      - name: 'Run database migration'
        run: './scripts/migrateup.sh'

      - name: 'Deploy to cloud run'
        run: 'gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-509917/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-509917 --max-instances=4'

