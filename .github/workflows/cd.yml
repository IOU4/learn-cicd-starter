on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-slim
    steps:
      - name: checkout the code
        uses: actions/checkout@v6
      
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: build
        run: ./scripts/buildprod.sh
